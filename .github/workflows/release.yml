name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v2.0.1

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound-dev

      - name: Install Build Dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install portaudio

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable
        run: |
          pyinstaller --noconsole --onefile shh.py

      - name: Compress macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r shh-macOS.zip shh.app
          mv shh shh-darwin

      - name: Rename Linux Binary
        if: runner.os == 'Linux'
        run: |
          mv dist/shh dist/shh-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shh-${{ runner.os }}
          path: |
            dist/shh-macOS.zip
            dist/shh-darwin
            dist/shh.exe
            dist/shh-linux

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: List downloaded artifacts
        run: |
          find .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Downloads

            - 🪟 **Windows:** [shh.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shh.exe)
            - 🐧 **Linux:** [shh-linux](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shh-linux)
            - 🍎 **macOS:** [shh-macOS.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shh-macOS.zip)

              **Instructions:**
            - **Windows:** Download `shh.exe` and double-click to run.
            - **Linux:** Download `shh-linux`, make it executable with `chmod +x shh-linux`, and run with `./shh-linux`.
            - **macOS:** Download `shh-macOS.zip`, unzip it, and run the `.app` bundle.
          files: |
            shh-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
