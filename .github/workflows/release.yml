name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0, v2.0.1

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Linux: Install PyAudio using apt
      - name: Install PyAudio on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound-dev

      # macOS: Install PortAudio, then install PyAudio
      - name: Install PyAudio on macOS
        if: runner.os == 'macOS'
        run: |
          brew install portaudio
          python -m pip install pyaudio

      # Windows: Directly install PyAudio (precompiled)
      - name: Install PyAudio on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyaudio

      # Install remaining dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable
        run: |
          pyinstaller --noconsole shh.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shh-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ubuntu-latest-binary/*
            windows-latest-binary/*
            macos-latest-binary/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
